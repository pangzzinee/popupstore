<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 — 팝업 캘린더</title>
  <meta name="description" content="내 동네를 등록하면 가까운 팝업을 먼저 보여드려요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/page.css" />
</head>
<body data-page="my">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <main id="main">
    <section class="wrap page-head">
      <h1 class="page-title">내 <em>동네</em>를 알려주세요</h1>
      <p class="page-desc">등록해두면 팝업 찾기에서 ‘내 주변’ 버튼으로 가까운 순서대로 볼 수 있어요.</p>
    </section>

    <div class="wrap">
      <!-- 내 동네: 로그인 없이도 쓸 수 있다 -->
      <div class="profile" id="placeBox">
        <section class="pcard reveal">
          <h3>📍 내 동네</h3>
          <p class="sub">지금 설정: <b id="placeNow">아직 없음</b></p>
          <div class="field">
            <label for="areaSelect">동네 고르기</label>
            <select id="areaSelect">
              <option value="">— 선택해주세요 —</option>
            </select>
            <span class="hint">이 기기에 저장돼요. 로그인하면 계정에도 함께 저장됩니다.</span>
          </div>
          <div class="p-actions">
            <button class="btn btn-primary btn-sm" type="button" id="savePlace">저장하기</button>
            <button class="btn btn-ghost btn-sm" type="button" id="locateBtn">🛰️ 현재 위치로 찾기</button>
            <button class="btn btn-ghost btn-sm" type="button" id="clearPlace">지우기</button>
          </div>
          <div class="auth-msg" id="placeMsg" role="status"></div>
        </section>
      </div>

      <!-- 로그인 영역 -->
      <div id="authArea"></div>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/place.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/my.js"></script>
</body>
</html>
